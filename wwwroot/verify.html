<!DOCTYPE html>
<html lang="enn">
    <head>
        <title>OSCAR Shared Session</title>
        <link rel="icon" type="image/png" href="static/images/oscar-logo.png" />
        <meta charset="utf-8">
        <meta id="meta-viewport" name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


        <link rel="stylesheet" href="/static/css/site.css">
    </head>
    <html>
        <body class="light-background ">           
            <div class="upload-page-body">
                <div class="footer-image"></div>
                <div style="padding: 10px; color:white; display: flex">
                    <img src="/static/images/oscar-logo.png" height="30">
                    <span style="font-weight: 600; font-size: 1.5rem; margin-left: 10px; flex-grow: 1">OSCAR <span style="font-weight: 400;">Shared Session</span></span>
                </div>

                <div id="pnlProcessing" class="step-box">                    
                    <div class="dotted-box">
                        <lottie-player class="anim-error" src="/static/images/anim_spinner.lottie.json" background="transparent" autoplay loop  speed="1"  style="max-width: 300px; max-height: 300px; width: 40vw"></lottie-player>                        
                    </div>                    
                </div>

                <div id="pnlResultOK" class="step-box hidden">
                    <div class="dotted-box">
                        <div style="margin-bottom: 15px;">Your session is ready to share!</div>
                        <div>
                            <div class="input-group mb-3" style="width: 500px; max-width: 60vw">
                                <input type="text" class="form-control" disabled readonly id="txtShortCode">
                                <button class="btn btn-outline-light" type="button" id="btnCopy">Copy</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="pnlResultFail" class="step-box hidden">
                    <div class="dotted-box">
                        The session failed to share: <span id="txtErrorText"></span>
                        <lottie-player class="anim-error" src="/static/images/anim_error.lottie.json" background="transparent"   speed="1"  style="max-width: 300px; max-height: 300px; width: 40vw"></lottie-player>
                    </div>
                </div>
         
            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
            <script src="https://cdn.canvasjs.com/ga/canvasjs.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js" integrity="sha512-4F1cxYdMiAW98oomSLaygEwmCnIP38pb4Kx70yQYqRwLVCs3DbRumfBq82T08g/4LJ/smbFGFpmeFlQgoDccgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
            <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
            <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
            <script src="/static/js/oscar/verify.js"></script>
            <script>
                $(async () => {
                    main();
                });
            </script>

        </body>
    </html>
</html>
